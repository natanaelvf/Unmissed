name: missed_lead_recovery
description: "Missed-Lead Recovery - contractor mobile app"
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.7.2

dependencies:
  sentry_flutter: ^9.21.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # HTTP (for future API integration)
  dio: ^5.7.0

  # Fonts
  google_fonts: ^6.2.1

  # Phone/URL launching
  url_launcher: ^6.3.1

  # Icons
  font_awesome_flutter: ^10.8.0

  # Supabase Auth
  supabase_flutter: ^2.8.0

  # Native Google Sign-In
  google_sign_in: ^6.2.2

  # Environment config
  flutter_dotenv: ^5.2.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

  # Locale persistence
  shared_preferences: ^2.3.4

  # Audio recording & playback (voicemail custom greetings)
  record: ^5.2.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  sentry_dart_plugin: ^3.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.dev
    - .env.prod

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: unmissed
